<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Brevet-Begleiter</title>
<style>
:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#fbbf24;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:70px}
header{padding:12px 16px;font-weight:700;font-size:18px;color:var(--ac)}
section{padding:0 12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220;border-top:1px solid #374151}
nav button{flex:1;padding:14px 2px;background:none;border:0;color:var(--mu);font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mu);flex:1;min-width:110px}
input,select{background:#0b1220;color:var(--tx);border:1px solid #374151;border-radius:8px;padding:10px;font-size:16px;width:100%}
button{font-size:16px;border-radius:8px;border:0;padding:10px 14px;background:#374151;color:var(--tx)}
button.primary{background:var(--ac);color:#111;font-weight:700;width:100%;margin-top:12px;padding:16px;font-size:18px}
button.x{background:none;color:var(--bad);padding:2px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid #374151}
th{color:var(--mu);font-weight:600}
.big{font-size:20px;font-weight:700;margin:6px 0}.lbl{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #374151}
.ck input{width:22px;height:22px}
h3{margin:14px 0 4px;color:var(--ac);font-size:15px}
small{color:var(--mu)}
.sep{border-top:1px solid #374151;margin:10px 0}a{color:var(--ac)}
#cand{max-height:50vh;overflow:auto}
</style>
</head>
<body>
<header>🚴 Brevet-Begleiter</header>

<section id="t-plan">
  <div class="card">
    <div class="row">
      <label class="f">Strecke<select id="dist"><option>200</option><option>300</option><option>400</option><option>600</option><option>1000</option></select></label>
      <label class="f">Start<input id="start" type="datetime-local"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="f">Ø km/h (rollend)<input id="speed" type="number" step="0.5" inputmode="decimal"></label>
      <label class="f">Pause je Kontrolle (min)<input id="pause" type="number" inputmode="numeric"></label>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <label class="f" style="flex:2">Kontrolle (Name)<input id="cname" placeholder="z. B. Bäckerei Müller"></label>
      <label class="f">km<input id="ckm" type="number" step="0.1" inputmode="decimal"></label>
      <button id="addc">＋</button>
    </div>
  </div>
  <div class="card"><table id="plan"></table>
    <p id="sum"></p>
    <small>*Ankunft = Fahrzeit bei Ø-Tempo + Pausen. Öffnungs-/Schlusszeiten nach ACP/Audax-Tabelle (Max 34/32/30/28 km/h, Min 15 km/h; Zielkontrolle mit offiziellem Limit 13:30/20:00/27:00/40:00/75:00 h). Puffer &lt; 1 h = gelb. Immer mit der offiziellen Brevetkarte gegenprüfen.</small>
  </div>
</section>

<section id="t-ride" hidden>
  <div class="card"><label class="f">Aktueller km-Stand (Tacho)<input id="curkm" type="number" step="0.1" inputmode="decimal"></label></div>
  <div id="ride"></div>
</section>

<section id="t-sup" hidden>
  <div class="card">
    <label class="f">GPX-Route laden<input id="gpx" type="file" accept=".gpx,application/gpx+xml,text/xml"></label>
    <p id="routest"></p><button id="clrroute">Route entfernen</button>
  </div>
  <div class="card"><div class="row">
    <label class="f">Flaschen gesamt (L)<input id="bottle" type="number" step="0.1" inputmode="decimal"></label>
    <label class="f">Trinken (L/h)<input id="drink" type="number" step="0.1" inputmode="decimal"></label>
    <label class="f">Essen alle max. (km)<input id="foodMax" type="number" inputmode="numeric"></label>
  </div></div>
  <div class="card" id="supsum"></div>
  <div class="card">
    <div class="row">
      <label class="f" style="flex:2">Ort<input id="sname" placeholder="z. B. Tankstelle Aral"></label>
      <label class="f">km<input id="skm" type="number" step="0.1" inputmode="decimal"></label>
      <label class="f">Art<select id="stype"><option value="both">💧🍞 Beides</option><option value="water">💧 Wasser</option><option value="food">🍞 Essen</option></select></label>
      <button id="adds">＋</button>
    </div>
    <p><button id="osm">🔎 Entlang der Route suchen (online)</button> <small id="osmst"></small></p>
  </div>
  <div class="card"><table id="suptab"></table></div>
  <div class="card" id="cand" style="display:block"></div>
</section>

<section id="t-check" hidden>
  <div id="check"></div>
  <div class="row" style="margin-top:12px"><input id="newi" placeholder="Eigener Punkt" style="flex:1"><button id="addi">＋</button></div>
  <p><button id="resetc">Haken zurücksetzen</button></p>
</section>

<section id="t-log" hidden>
  <div class="card"><table id="logt"></table></div>
  <p class="row"><button id="csv">CSV exportieren</button><button id="clearl">Löschen</button></p>
</section>

<nav>
  <button class="on" data-t="t-plan">Planer</button>
  <button data-t="t-ride">Unterwegs</button>
  <button data-t="t-sup">Versorgung</button>
  <button data-t="t-check">Packliste</button>
  <button data-t="t-log">Logbuch</button>
</nav>
<script src="app.js"></script>
</body>
</html>
